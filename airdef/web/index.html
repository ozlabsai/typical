<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Typical · Air Defence</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Rubik:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- vendored: maplibre-gl 4.7.1, deck.gl 9.0.38 (no CDN at the venue; the basemap tiles still need internet) -->
<link href="/web/vendor/maplibre-gl.css" rel="stylesheet">
<script src="/web/vendor/maplibre-gl.js"></script>
<script src="/web/vendor/deck.min.js"></script>
<style>
:root {
  --ink: #f0eeeb; --dim: #a19d97; --mute: #6d6a66; --bg: #141312; --panel: rgba(22, 21, 20, .9);
  --line: rgba(240, 238, 235, .1); --threat: #ff5a36; --int: #5ad1ff; --typ: #ffb547; --ok: #7fd18b; --bad: #ff4d4d;
  --sans: "Schibsted Grotesk", "Rubik", system-ui, sans-serif; --mono: "Geist Mono", ui-monospace, monospace;
}
html[lang=he] { --sans: "Rubik", system-ui, sans-serif; }
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.45 var(--sans); overflow: hidden; }
#map { position: fixed; inset: 0; }
.panel { position: fixed; background: var(--panel); backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: 14px; }
button { font: inherit; color: inherit; background: none; border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
button:hover { border-color: rgba(240,238,235,.35); }
button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.mono { font-family: var(--mono); font-feature-settings: "tnum"; direction: ltr; unicode-bidi: isolate; }
.eyebrow { font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--mute); }
html[lang=he] .eyebrow { letter-spacing: 0; }

/* top bar: one line */
#top { top: 12px; inset-inline: 12px; height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 12px; }
#brand { font-weight: 700; white-space: nowrap; }
#brand b { color: var(--typ); font-weight: 700; }
#scen { display: flex; gap: 4px; }
#scen button { white-space: nowrap; padding: 4px 9px; }
#transport { display: flex; gap: 4px; margin-inline-start: auto; align-items: center; }
#speeds { display: flex; gap: 2px; }
#speeds button { padding: 4px 7px; }
#clock { font-size: 15px; min-width: 84px; text-align: end; }
#busy { color: var(--typ); font-size: 11px; visibility: hidden; white-space: nowrap; }
#lang { font-weight: 600; }

/* the threat card */
#card { top: 72px; inset-inline-end: 12px; width: 420px; max-height: calc(100vh - 84px); overflow-y: auto; padding: 16px 18px; scrollbar-width: thin; }
#card .empty { color: var(--dim); }
.chead { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.ctitle { font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
.csub { color: var(--dim); margin-top: 2px; }
.csub b { color: var(--ink); font-weight: 500; }
.csub .prio { color: var(--typ); }
.tti { text-align: end; }
.tti .big { font-size: 26px; font-weight: 600; font-family: var(--mono); line-height: 1.05; direction: ltr; }
.follow { margin-top: 10px; display: flex; justify-content: space-between; align-items: center; color: var(--mute); font-size: 11.5px; }
.follow button { padding: 2px 8px; font-size: 11.5px; }
svg.tl { display: block; width: 100%; margin: 14px 0 6px; overflow: visible; }
svg.tl text { font: 10.5px var(--sans); fill: var(--dim); }
.log { color: var(--dim); font-size: 12px; margin-bottom: 14px; }
.log b { color: var(--ink); font-weight: 500; }
.call { border-top: 1px solid var(--line); padding-top: 14px; }
.callmain { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin: 4px 0 2px; }
.callmain .what { font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
.callmain .p { font: 600 19px var(--mono); color: var(--typ); }
.why { color: var(--dim); font-size: 12px; }
.lens { display: flex; height: 6px; border-radius: 3px; overflow: hidden; margin: 6px 0 2px; background: var(--line); }
.lens i { display: block; height: 100%; }
.l-local { background: #d8d4ce; } .l-raid { background: var(--typ); } .l-campaign { background: #c084fc; }
.lenskey { display: flex; gap: 12px; font-size: 11px; color: var(--mute); flex-wrap: wrap; }
.lenskey span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-inline-end: 5px; vertical-align: -1px; }
.lenskey .k-local::before { background: #d8d4ce; } .lenskey .k-raid::before { background: var(--typ); } .lenskey .k-campaign::before { background: #c084fc; }
.alts { margin-top: 12px; display: grid; gap: 7px; }
.alt { display: grid; grid-template-columns: 1fr 44px; gap: 2px 10px; align-items: center; color: var(--dim); font-size: 12.5px; }
.alt .p { font-family: var(--mono); text-align: end; }
.alt .lens { grid-column: 1 / 3; height: 4px; margin: 0; }
.esc { background: rgba(255,181,71,.12); border: 1px solid rgba(255,181,71,.45); color: var(--typ); border-radius: 9px; padding: 7px 10px; margin: 8px 0; font-size: 12px; }
.agree { margin-top: 12px; font-size: 12px; color: var(--dim); }
.agree b { color: var(--ink); font-weight: 500; }
details.reads { margin-top: 12px; }
details.reads summary { cursor: pointer; color: var(--mute); font-size: 12px; }
details.reads pre { font: 11.5px/1.5 var(--mono); color: var(--dim); background: rgba(0,0,0,.28); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; white-space: pre-wrap; margin-top: 6px; direction: ltr; text-align: left; }

/* tonight's score */
#score { bottom: 12px; inset-inline-start: 12px; width: 440px; padding: 14px 16px; }
#score table { width: 100%; border-collapse: collapse; margin-top: 8px; }
#score th { font-weight: 500; text-align: end; color: var(--dim); font-size: 12px; padding: 0 0 4px; }
#score th:first-child, #score td:first-child { text-align: start; }
#score td { text-align: end; font: 15px var(--mono); padding: 3px 0; }
#score td:first-child { font: 13px var(--sans); color: var(--dim); }
#score .typ { color: var(--typ); }
#score .bad { color: var(--bad); }
.scorefoot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; color: var(--mute); font-size: 11.5px; }
.scorefoot button { padding: 2px 8px; font-size: 11.5px; }

/* settings drawer */
#drawer { top: 72px; inset-inline-start: 12px; width: 400px; bottom: 210px; overflow-y: auto; padding: 16px 18px; display: none; scrollbar-width: thin; }
#drawer.open { display: block; }
.field { margin: 0 0 16px; }
.field .eyebrow { display: block; margin-bottom: 7px; }
.seg { display: flex; gap: 4px; flex-wrap: wrap; }
.seg button { padding: 4px 9px; font-size: 12px; }
input[type=range] { width: 100%; accent-color: var(--typ); }
.rng { display: grid; grid-template-columns: 120px 1fr 60px; gap: 8px; align-items: center; margin: 3px 0; color: var(--dim); font-size: 12px; }
.rng span:last-child { text-align: end; color: var(--ink); font-family: var(--mono); }
details.dmg summary { cursor: pointer; color: var(--dim); margin: 6px 0; font-size: 12px; }
.sitegrid { display: grid; grid-template-columns: 1fr 74px; gap: 3px 8px; align-items: center; color: var(--dim); font-size: 12px; }
.sitegrid input { width: 74px; background: rgba(0,0,0,.3); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; font: 12px var(--mono); }
.note { color: var(--mute); font-size: 11.5px; }
.maplibregl-ctrl-attrib { opacity: .35; }
</style>
</head>
<body>
<div id="map"></div>
<div id="top" class="panel">
  <div id="brand">Typical <b>·</b> <span data-i18n="brand">Air Defence</span></div>
  <div id="scen"></div>
  <div id="transport">
    <span id="busy" data-i18n="busy">deciding…</span>
    <button id="play"></button><span id="speeds"></span>
    <button id="skip" data-i18n="skip">Skip transit</button>
    <span id="clock" class="mono">T+00:00</span>
    <button id="lang"></button>
    <button id="gear" title="settings">⚙</button>
  </div>
</div>
<div id="drawer" class="panel"></div>
<div id="card" class="panel"></div>
<div id="score" class="panel"></div>
<script src="/web/app.js"></script>
</body>
</html>
