<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Typical · Air defence</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500&family=Heebo:wght@400;500&display=swap" rel="stylesheet">
<!-- taste index: airdef/brand (Decart-derived tokens + components) -->
<link href="/brand/brand.css" rel="stylesheet">
<!-- vendored: maplibre-gl 4.7.1, deck.gl 9.0.38 (no CDN at the venue; the basemap tiles still need internet) -->
<link href="/web/vendor/maplibre-gl.css" rel="stylesheet">
<script src="/web/vendor/maplibre-gl.js"></script>
<script src="/web/vendor/deck.min.js"></script>
<style>
/* Extensions to the taste index, tagged like brand.css:
   [X] --hit: the site's own live red (#ff3b30), reused for "a threat hit a defended site" — the one alarm state the brand lacks.
   [X] --lane: a lane fill one step darker than --dc-surface so windows read on a white strip. */
:root { --hit: #ff3b30; --lane: #ececee; --aside-w: 420px; --strip-h: 96px; --bar-h: 68px; }
html[lang=he] { --dc-font-sans: "Heebo", "Figtree", Arial, sans-serif; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { font-family: var(--dc-font-sans); color: var(--dc-dark); background: var(--dc-bg-page); -webkit-font-smoothing: antialiased;
  display: grid; grid-template-columns: 1fr var(--aside-w); grid-template-rows: var(--bar-h) 1fr var(--strip-h); }
.num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
.kicker { font-size: .9375rem; line-height: 1.3; letter-spacing: -.01em; color: var(--dc-grey); margin: 0; }
button { font-family: inherit; }
.dc-pill--sm { padding: .375rem 1rem; font-size: .9375rem; }
header .dc-tabs--sm { padding: .25rem; gap: .125rem; }
header .dc-tabs--sm .dc-tab { padding: .375rem .8125rem; font-size: .9375rem; }

/* ---------- bar ---------- */
header { grid-column: 1 / -1; display: flex; align-items: center; gap: 1.5rem; padding-inline: 1.5rem; background: var(--dc-white); z-index: 2; }
.mark { font-size: 1.25rem; letter-spacing: -.03em; white-space: nowrap; }
.mark b { font-weight: 500; color: var(--dc-ink); }
.mark span { color: var(--dc-grey); }
.bar-end { margin-inline-start: auto; display: flex; align-items: center; gap: .5rem; }
#clock { font-size: 1.25rem; letter-spacing: -.02em; color: var(--dc-ink-2); min-width: 6.5rem; text-align: end; margin-inline-end: .5rem; }
#note { font-size: .875rem; color: var(--dc-grey); white-space: nowrap; min-width: 7rem; text-align: end; }

/* ---------- map ---------- */
#mapwrap { grid-column: 1; grid-row: 2; position: relative; isolation: isolate; }
#map { position: absolute; inset: 0; }
.maplibregl-ctrl-attrib { opacity: .5; font-size: 10px; }

/* ---------- decision panel ---------- */
aside { grid-column: 2; grid-row: 2 / 4; background: var(--dc-white); display: flex; flex-direction: column; min-height: 0; }
.scroll { flex: 1; overflow-y: auto; padding: 1.75rem 1.75rem 1rem; scrollbar-width: thin; }
.row { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
.threat { font-size: 2rem; line-height: 1.15; letter-spacing: -.04em; color: var(--dc-ink-2); margin: .375rem 0 .25rem; font-weight: 400; }
.target { font-size: 1.0625rem; color: var(--dc-text-sub); letter-spacing: -.02em; }
.target b { font-weight: 400; color: var(--dc-ink-2); }
.tag { display: inline-flex; padding: .0625rem .625rem; border: 1px solid var(--dc-ink); border-radius: var(--dc-r-pill); font-size: .8125rem; font-weight: 500; color: var(--dc-ink); margin-inline-start: .375rem; vertical-align: 2px; }
.eta { font-size: 2.5rem; line-height: 1; letter-spacing: -.04em; color: var(--dc-ink-2); }
.what { font-size: 2.25rem; line-height: 1.15; letter-spacing: -.04em; color: var(--dc-blue); margin: 2.25rem 0 .75rem; font-weight: 400; }
.linkish { border: 0; background: none; padding: 0; font: inherit; color: var(--dc-blue); cursor: pointer; }
details.detail { margin-top: 2rem; }
details.detail summary { cursor: pointer; font-size: .9375rem; color: var(--dc-text-nav); list-style: none; }
details.detail summary::after { content: " +"; }
details.detail[open] summary::after { content: " −"; }
details.detail .alt { padding: .375rem 0; font-size: .9375rem; }
.dline { font-size: .9375rem; color: var(--dc-grey); margin: .875rem 0 .25rem; }
details.detail pre { margin: 0; white-space: pre-wrap; font: .8125rem/1.6 var(--dc-font-sans); color: var(--dc-text-sub); direction: ltr; text-align: left; background: var(--dc-surface); border-radius: var(--dc-r-row); padding: .75rem 1rem; }
#scenDrop .dc-dropdown__list { z-index: 6; min-width: 22rem; }
#speedDrop .dc-dropdown__list { z-index: 6; min-width: 13rem; inset-inline-start: auto; inset-inline-end: 0; left: auto; }
.dc-dropdown__item { width: 100%; border: 0; background: none; text-align: start; cursor: pointer; font-family: inherit; }
.dc-dropdown__item[aria-checked="true"] .dc-dropdown__label { color: var(--dc-blue); }
.call { margin-top: 2rem; }
.call .what { font-size: 2.125rem; line-height: 1.15; letter-spacing: -.04em; color: var(--dc-blue); margin: .375rem 0 .5rem; font-weight: 400; }
.call .conf { font-size: 1rem; color: var(--dc-grey); }
.local { font-size: .9375rem; color: var(--dc-text-sub); margin: .625rem 0 0; }
.local b { font-weight: 500; color: var(--dc-ink-2); }
.why { font-size: 1.0625rem; line-height: 1.5; letter-spacing: -.02em; color: var(--dc-text-body); margin: .75rem 0 0; }
.op { margin-top: 1rem; display: inline-flex; align-items: center; gap: .5rem; padding: .375rem .875rem; border: 1px solid var(--dc-ink); border-radius: var(--dc-r-pill); font-size: .875rem; font-weight: 500; }
.alts { margin-top: 1.5rem; background: var(--dc-surface); border-radius: var(--dc-r-band); padding: .75rem 1.25rem; }
.alt { display: flex; justify-content: space-between; gap: 1rem; padding: .5rem 0; font-size: 1rem; color: var(--dc-text-body); letter-spacing: -.01em; }
.alt span:last-child { color: var(--dc-grey); }
.agree { margin-top: .875rem; font-size: .9375rem; color: var(--dc-grey); }
.reads { margin-top: 1.25rem; border-top: 0; }
.reads .dc-accordion__item { border-bottom: 0; }
.reads .dc-accordion__trigger { padding: .75rem 0; font-size: .9375rem; color: var(--dc-text-nav); }
.reads pre { margin: 0 0 1rem; white-space: pre-wrap; font: .8125rem/1.6 var(--dc-font-sans); color: var(--dc-text-sub); direction: ltr; text-align: left; }
.empty { color: var(--dc-grey); font-size: 1.0625rem; line-height: 1.5; margin-top: 2rem; }
.tonight { padding: 1.25rem 1.75rem 1.5rem; background: var(--dc-surface); margin: 0 1rem 1rem; border-radius: var(--dc-r-band); }
.menuhead { padding: .75rem 1rem .25rem; border-top: 1px solid var(--dc-line, #e2e2e4); margin-top: .25rem; }
.tag.ty { border-color: var(--accent, #2548f6); color: var(--accent, #2548f6); }
#nextCase { margin-top: .75rem; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.25rem; margin-top: .75rem; }
.stat .l { font-size: .875rem; color: var(--dc-grey); }
.stat .v { font-size: 2.25rem; letter-spacing: -.04em; color: var(--dc-ink-2); line-height: 1.1; }
.stat .v.hit { color: var(--hit); }
.stat .vs { font-size: .9375rem; color: var(--dc-grey); margin-top: .125rem; }
.legend { margin-top: .75rem; font-size: .8125rem; color: var(--dc-grey); display: flex; align-items: center; gap: .375rem; }
.legend i { display: inline-block; width: .5rem; height: .5rem; border-radius: 50%; background: var(--dc-grey); }
.tfoot { display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; font-size: .8125rem; color: var(--dc-grey); }

/* ---------- flight strip ---------- */
#strip { grid-column: 1; grid-row: 3; background: var(--dc-white); padding: .5rem 1.5rem 0; display: flex; flex-direction: column; min-height: 0; }
#strip svg { flex: 1; width: 100%; display: block; overflow: visible; }
#strip svg text { font-family: var(--dc-font-sans); font-size: 12px; fill: var(--dc-grey); }
#strip svg .lane-l { fill: var(--dc-text-body); font-size: 13px; }
#strip svg .lane-l.on { fill: var(--dc-blue); }
#strip svg .call-l { fill: var(--dc-ink-2); font-size: 12px; }

/* ---------- settings sheet ---------- */
#sheet { position: fixed; top: calc(var(--bar-h) + .5rem); inset-inline-end: 1rem; width: 25rem; max-height: calc(100vh - var(--bar-h) - 1.5rem); overflow-y: auto;
  background: var(--dc-white); border-radius: var(--dc-r-band); box-shadow: var(--dc-shadow-menu), 0 0 0 1px var(--dc-line); padding: 1.5rem; display: none; z-index: 5; scrollbar-width: thin; }
#sheet.open { display: block; }
.field { margin-bottom: 1.5rem; }
.field > .kicker { margin-bottom: .625rem; }
.chips { display: flex; flex-wrap: wrap; gap: .375rem; }
.chip { border: 1px solid transparent; background: var(--dc-surface); color: var(--dc-text-pill); border-radius: var(--dc-r-pill); padding: .3125rem .875rem; font-size: .875rem; font-weight: 500; cursor: pointer;
  transition: background-color var(--dc-dur-ui) var(--dc-ease), border-color var(--dc-dur-ui) var(--dc-ease), color var(--dc-dur-ui) var(--dc-ease); }
.chip:hover { background: var(--dc-surface-hover); color: var(--dc-ink); }
.chip[aria-pressed="true"] { background: var(--dc-white); border-color: var(--dc-ink); color: var(--dc-ink); }
.chip:focus-visible, .dc-tab:focus-visible { outline: 2px solid var(--dc-focus); outline-offset: 2px; }
.rng { display: grid; grid-template-columns: 8.5rem 1fr 4rem; gap: .75rem; align-items: center; margin: .25rem 0; font-size: .9375rem; color: var(--dc-text-body); }
.rng output { text-align: end; color: var(--dc-ink-2); }
input[type=range] { width: 100%; accent-color: var(--dc-blue); }
details.more summary { cursor: pointer; font-size: .9375rem; color: var(--dc-text-nav); margin: .5rem 0; }
.sitegrid { display: grid; grid-template-columns: 1fr 5.5rem; gap: .25rem .75rem; align-items: center; font-size: .875rem; color: var(--dc-text-body); }
.sitegrid input { width: 5.5rem; border: 0; background: var(--dc-surface); border-radius: var(--dc-r-pill); padding: .25rem .75rem; font: inherit; color: var(--dc-ink-2); }
.note { font-size: .8125rem; line-height: 1.5; color: var(--dc-grey); }
@media (max-width: 1280px) { :root { --aside-w: 380px; --strip-h: 180px; } .threat { font-size: 1.75rem; } .call .what { font-size: 1.875rem; } }
</style>
</head>
<body>
<header>
  <div class="mark"><b>Typical</b> <span data-i18n="brand">Air defence</span></div>
  <div class="dc-dropdown" id="scenDrop">
    <button id="scenBtn" class="dc-pill dc-pill--ghost dc-pill--sm" aria-haspopup="menu">… <span aria-hidden="true">▾</span></button>
    <div class="dc-dropdown__list" id="scenMenu" role="menu"></div>
  </div>
  <div class="bar-end">
    <span id="note"></span>
    <button id="play" class="dc-pill dc-pill--primary dc-pill--sm"></button>
    <div class="dc-dropdown" id="speedDrop">
      <button id="speedBtn" class="dc-pill dc-pill--ghost dc-pill--sm" aria-haspopup="menu">… <span aria-hidden="true">▾</span></button>
      <div class="dc-dropdown__list" id="speedMenu" role="menu"></div>
    </div>
    <button id="lang" class="dc-pill dc-pill--ghost dc-pill--sm"></button>
    <button id="gear" class="dc-pill dc-pill--secondary dc-pill--sm" data-i18n="settings" aria-expanded="false" aria-controls="sheet">Settings</button>
  </div>
</header>
<div id="mapwrap"><div id="map"></div></div>
<section id="strip" aria-label="flight timeline"></section>
<aside><div class="scroll" id="decision"></div><div class="tonight" id="tonight"></div></aside>
<div id="sheet" role="dialog" aria-label="Settings"></div>
<script src="/web/app.js"></script>
</body>
</html>
