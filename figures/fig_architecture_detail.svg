<text x="40" y="882" font-size="10.3" fill="#94a3b8">Depths shown for typical-small (Qwen3-1.7B-Base, tap 20/28). typical-medium taps 23/36 on Qwen3.5-4B; typical-large-preview taps 28/40 on Qwen3-14B.</text>
