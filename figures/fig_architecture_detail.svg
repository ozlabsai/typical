<text x="112" y="300.6" font-size="10.5" fill="#94a3b8" text-anchor="end">discarded</text>
<line x1="92" y1="354.4" x2="730" y2="354.4" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 4"/>
<text x="736" y="348.4" font-size="12.5" font-weight="700" fill="#dc2626">TAP — read here, at layer 20 of 28 (71%)</text>
<text x="736" y="364.4" font-size="10.5" fill="#dc2626">the final layer is optimised for next-token prediction,</text>
<text x="736" y="378.4" font-size="10.5" fill="#dc2626">which is not the best representation for deciding</text>
<text x="150" y="728" font-size="12.5" font-weight="600" fill="#0f172a">Token sequence — one causal pass</text>
<rect x="150" y="742" width="168" height="46" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4"/>
<text x="160" y="761" font-size="11.5" font-weight="600" fill="#1e40af">State prefix</text>
<text x="160" y="777" font-size="10" fill="#1e40af">encoded ONCE, KV-cached</text>
<line x1="234.0" y1="740" x2="234.0" y2="713.0" stroke="#3b82f6" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="326" y="742" width="104" height="46" rx="5" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.4"/>
<text x="336" y="761" font-size="11.5" font-weight="600" fill="#115e59">Question</text>
<text x="336" y="777" font-size="10" fill="#115e59">asked at call time</text>
<line x1="378.0" y1="740" x2="378.0" y2="713.0" stroke="#0d9488" stroke-width="1.3" marker-end="url(#ag)"/>
<rect x="438" y="742" width="150" height="46" rx="5" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="448" y="761" font-size="11.5" font-weight="600" fill="#92400e">Candidates</text>
<text x="448" y="777" font-size="10" fill="#92400e">defined at call time</text>
<line x1="513.0" y1="740" x2="513.0" y2="713.0" stroke="#b45309" stroke-width="1.3" marker-end="url(#ao)"/>
<rect x="596" y="742" width="84" height="46" rx="5" fill="#f1f5f9" stroke="#334155" stroke-width="1.4"/>
<text x="606" y="761" font-size="11.5" font-weight="600" fill="#0f172a">terminal</text>
<text x="606" y="777" font-size="10" fill="#0f172a">decision position</text>
<line x1="638.0" y1="740" x2="638.0" y2="713.0" stroke="#334155" stroke-width="1.3" marker-end="url(#a)"/>
<text x="150" y="812" font-size="10.5" fill="#64748b">O(state) once, then O(question + candidates) per decision — ~22 ms state encode, ~2.7 ms per further question at K ≤ 32.</text>
<line x1="513" y1="354.4" x2="513" y2="196.2" stroke="#b45309" stroke-width="1.6" marker-end="url(#ao)"/>
<line x1="638" y1="354.4" x2="638" y2="196.2" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
<text x="509" y="190.2" font-size="10.5" fill="#b45309" text-anchor="middle">c₃ᵏ</text>
<text x="642" y="190.2" font-size="10.5" fill="#334155" text-anchor="middle">h_D</text>
<text x="150" y="206.2" font-size="10.5" fill="#475569">each candidate's own contextual state, and the terminal decision state</text>
<rect x="700" y="96" width="404" height="150" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="716" y="120" font-size="13.5" font-weight="700" fill="#991b1b">N3 contextual readout</text>
<text x="716" y="142" font-size="11" fill="#7f1d1d">z-score both sides, then LayerNorm + Linear → 256-d</text>
<text x="716" y="161" font-size="11" font-family="ui-monospace,Menlo,monospace" fill="#7f1d1d">u = proj_h(h_D)        v_k = proj_3(c₃ᵏ)</text>
<text x="716" y="180" font-size="11" font-family="ui-monospace,Menlo,monospace" fill="#7f1d1d">s_k = ⟨u,v_k⟩·d^−½ + w(u⊙v_k) + res(u⊙v_k)</text>
<text x="716" y="199" font-size="11" fill="#7f1d1d">bilinear + linear + GELU-MLP residual, per candidate</text>
<text x="716" y="226" font-size="10.5" font-style="italic" fill="#991b1b">A candidate-blind state fails here: priors and calibration transfer, question-conditioned knowledge does not.</text>
<rect x="700" y="260" width="404" height="44" rx="7" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
<text x="716" y="278" font-size="12" font-weight="700" fill="#3730a3">Factored ∅ gate — abstention is a gate, not a candidate</text>
<text x="716" y="295" font-size="10.3" fill="#3730a3">MLP(4 + 4·d_v → 256 → 1) over set statistics; preserves pairwise odds among real candidates</text>
<rect x="700" y="322" width="128" height="72" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.3"/>
<text x="713" y="343" font-size="12.5" font-weight="700" fill="#0f172a">Choice</text>
<text x="713" y="361" font-size="10.3" fill="#475569">categorical</text>
<text x="713" y="377" font-size="10" fill="#64748b">softmax over your K labels</text>
<rect x="837" y="322" width="128" height="72" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.3"/>
<text x="850" y="343" font-size="12.5" font-weight="700" fill="#0f172a">Score</text>
<text x="850" y="361" font-size="10.3" fill="#475569">ordinal-smoothed</text>
<text x="850" y="377" font-size="10" fill="#64748b">τ = 0.7; levels are ordered</text>
<rect x="974" y="322" width="128" height="72" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.3"/>
<text x="987" y="343" font-size="12.5" font-weight="700" fill="#0f172a">Noul</text>
<text x="987" y="361" font-size="10.3" fill="#475569">Bernoulli on h_D</text>
<text x="987" y="377" font-size="10" fill="#64748b">exactly order-invariant</text>
<text x="700" y="414" font-size="10.5" fill="#475569">Typed heads are contracts on the output distribution, not three separate models.</text>
<rect x="1124" y="96" width="172" height="150" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
<text x="1139" y="120" font-size="13" font-weight="700" fill="#166534">Output</text>
<text x="1139" y="144" font-size="11" font-family="ui-monospace,Menlo,monospace" fill="#14532d">refund      .82</text>
<text x="1139" y="163" font-size="11" font-family="ui-monospace,Menlo,monospace" fill="#14532d">replacement .11</text>
<text x="1139" y="182" font-size="11" font-family="ui-monospace,Menlo,monospace" fill="#14532d">repair      .05</text>
<text x="1139" y="208" font-size="11" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#166534">∅ (none)    .02</text>
<text x="1139" y="230" font-size="10.3" fill="#166534">nothing to parse</text>
