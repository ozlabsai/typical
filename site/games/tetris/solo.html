<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tetris — typical-small plays</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Geist+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Full-screen, model-only Tetris for screen recordings. Same tokens as ./index.html (the duel
     frame); this page adds motion instead of chrome: the piece rotates, slides and drops the way the
     model chose, and the model's probabilities for every offered drop sit beside the board.
     ?seed=N picks the game (8 on typical-small rev 0ff732e: 272 pieces, 98 lines, then it stacks out -- a game with an ending), ?speed=N scales the pacing. */
  :root {
    color-scheme: dark;
    --warm: #f0eeeb;
    --mid: #938f89;
    --steel: #c2bfba;
    --panel: #0b0b0b;
    --well: #111112;
    --grid: #171718;
    --live: #8fd9b6;
    --rule: rgba(240, 238, 235, 0.12);
    --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --sans: "Schibsted Grotesk", ui-sans-serif, system-ui, -apple-system, sans-serif;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: radial-gradient(ellipse 34% 58% at 50% 50%, rgba(143, 217, 182, 0.07), transparent 72%), var(--panel);
    color: var(--warm);
    font: 400 14px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
    cursor: none;
  }
  .eyebrow { margin: 0; font: 700 12px/1.5 var(--mono); letter-spacing: 0.9px; text-transform: uppercase; color: var(--mid); }

  main { height: 100%; display: grid; grid-template-columns: 1fr auto 1fr; gap: 64px; padding: 48px 56px; }
  .rail { display: flex; flex-direction: column; width: 100%; max-width: 400px; min-width: 0; }
  .left { justify-self: end; justify-content: space-between; }
  .right { justify-self: start; gap: 40px; padding-top: 4px; }

  /* ---- left: who is playing, and the score ------------------------------------------------ */
  .live { display: inline-flex; align-items: center; gap: 10px; color: var(--live); }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--live); box-shadow: 0 0 12px var(--live); animation: breathe 1.8s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: 0.35; box-shadow: none; } }
  h1 { margin: 18px 0 16px; font: 600 72px/0.95 var(--sans); letter-spacing: -2.4px; }
  .lede { margin: 0; max-width: 330px; color: var(--mid); font: 400 15px/1.55 var(--sans); }
  .lede b { color: var(--steel); font-weight: 500; white-space: nowrap; }

  .stats { margin: 0; display: grid; gap: 22px; }
  .stats dt { font: 700 12px/1.5 var(--mono); letter-spacing: 0.9px; text-transform: uppercase; color: var(--mid); }
  .stats dd { margin: 2px 0 0; font: 400 34px/1 var(--mono); font-variant-numeric: tabular-nums; }
  .stats .big dd { font-size: 120px; letter-spacing: -6px; color: var(--live); text-shadow: 0 0 34px rgba(143, 217, 182, 0.35); }
  .stats .row { display: flex; gap: 48px; }

  /* ---- the board ---------------------------------------------------------------------------- */
  .stage { position: relative; height: 100%; aspect-ratio: 1 / 2; }
  .board {
    height: 100%;
    display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(20, 1fr); gap: 2px;
    padding: 6px; border-radius: 10px;
    background: var(--well);
    box-shadow: inset 0 0 0 1px var(--rule), 0 30px 80px rgba(0, 0, 0, 0.55);
  }
  .board.thud { animation: thud 170ms var(--ease); }
  @keyframes thud { 30% { transform: translateY(5px); } }
  .cell { background: var(--grid); border-radius: 3px; }
  /* Blocks get a lit top edge and a shaded bottom so the stack reads as objects, not a heat map. */
  .cell.lock, .cell.fall {
    background: var(--c);
    box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.22), inset 0 -3px 0 rgba(0, 0, 0, 0.22);
  }
  .cell.fall { box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.3), inset 0 -3px 0 rgba(0, 0, 0, 0.2), 0 0 22px color-mix(in srgb, var(--c) 55%, transparent); position: relative; z-index: 1; }
  .cell.ghost { background: color-mix(in srgb, var(--c) 9%, transparent); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--c) 70%, transparent); }
  .cell.clear { animation: clear 340ms ease-in forwards; }
  @keyframes clear {
    0%, 30% { background: #fff; box-shadow: 0 0 26px rgba(255, 255, 255, 0.8); }
    100% { background: #fff; opacity: 0; transform: scaleY(0.15); }
  }

  .callout {
    position: absolute; left: 0; right: 0; top: 38%; z-index: 3; pointer-events: none;
    text-align: center; font: 700 64px/1 var(--mono); letter-spacing: 6px; text-transform: uppercase;
    color: var(--live); text-shadow: 0 0 30px rgba(143, 217, 182, 0.6);
    opacity: 0;
  }
  .callout.go { animation: callout 1100ms var(--ease); }
  @keyframes callout { 0% { opacity: 0; transform: scale(0.8); } 15% { opacity: 1; transform: scale(1.04); } 70% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-40px); } }

  .veil {
    position: absolute; inset: 0; z-index: 4; border-radius: 10px;
    display: grid; place-content: center; gap: 14px; padding: 32px; text-align: center;
    background: rgba(11, 11, 11, 0.84); backdrop-filter: blur(3px);
  }
  .veil[hidden] { display: none; }
  .veil h2 { margin: 0; font: 600 44px/1.05 var(--sans); letter-spacing: -1.2px; }
  .veil p { margin: 0; color: var(--mid); font: 400 13px/1.6 var(--mono); }
  .veil code { color: var(--steel); }

  /* ---- right: what the model was offered, and what it said -------------------------------- */
  .next { display: grid; grid-template-columns: repeat(4, 22px); grid-auto-rows: 22px; gap: 2px; margin-top: 12px; }
  .next i { border-radius: 3px; background: var(--c); box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.22), inset 0 -2px 0 rgba(0, 0, 0, 0.22); }
  .q { margin: 10px 0 0; font: 500 21px/1.3 var(--sans); letter-spacing: -0.3px; }
  ol { list-style: none; margin: 18px 0 0; padding: 0; display: grid; gap: 14px; }
  li { display: grid; grid-template-columns: 1fr auto; column-gap: 16px; row-gap: 7px; align-items: baseline; transition: opacity 240ms var(--ease); }
  li .lab { color: var(--steel); font: 400 15px/1.3 var(--sans); }
  li .p { color: var(--mid); font: 400 15px/1 var(--mono); font-variant-numeric: tabular-nums; }
  li .bar { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: rgba(240, 238, 235, 0.07); overflow: hidden; }
  li .bar::after { content: ''; display: block; height: 100%; width: calc(var(--p, 0) * 100%); background: var(--mid); border-radius: 2px; transition: width 320ms var(--ease); }
  li.pick .lab { color: var(--warm); font-weight: 600; }
  li.pick .lab::before { content: '▸ '; color: var(--live); }
  li.pick .p { color: var(--live); }
  li.pick .bar::after { background: var(--live); box-shadow: 0 0 12px var(--live); }
  ol.wait li { opacity: 0.45; }
  .meta { margin: 0; color: var(--mid); font: 400 12px/1.6 var(--mono); letter-spacing: 0.3px; }
  .meta b { color: var(--steel); font-weight: 400; }

  /* Portrait (9:16) recordings: board on top, the choice underneath, title and score in one row. */
  @media (max-aspect-ratio: 1 / 1) {
    main { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; gap: 36px; padding: 56px 48px; justify-items: center; }
    .rail { max-width: none; }
    .left { flex-direction: row; align-items: flex-end; }
    h1 { font-size: 56px; }
    .lede { display: none; }
    .stats { grid-auto-flow: column; align-items: end; gap: 40px; }
    .stats .big dd { font-size: 80px; letter-spacing: -4px; }
    .right { gap: 24px; min-height: 420px; }
    .right > section:first-child { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .board.thud, .callout.go, .live i { animation: none; }
  }
</style>
</head>
<body>
<main>
  <section class="rail left">
    <div>
      <p class="eyebrow live"><i></i><span id="source">Live · typical-small</span></p>
      <h1>Tetris</h1>
      <p class="lede">Every placement on this board is <b>typical-small</b>'s own choice.</p>
    </div>
    <dl class="stats">
      <div class="big"><dt>Lines</dt><dd id="lines">0</dd></div>
      <div class="row">
        <div><dt>Score</dt><dd id="score">0</dd></div>
        <div><dt>Pieces</dt><dd id="pieces">0</dd></div>
      </div>
    </dl>
  </section>

  <section class="stage">
    <div class="board" id="board" aria-label="typical-small's board"></div>
    <div class="callout" id="callout"></div>
    <div class="veil" id="veil"><h2 id="veilTitle">Connecting</h2><p id="veilText">looking for the model server</p></div>
  </section>

  <section class="rail right">
    <section><p class="eyebrow">Next</p><div class="next" id="next"></div></section>
    <section>
      <p class="eyebrow">The model is asked</p>
      <p class="q" id="question"></p>
      <ol id="options"></ol>
    </section>
    <p class="meta" id="meta">&nbsp;</p>
  </section>
</main>
<script type="module">
import { Tetris, SHAPES, QUESTION, dropRow } from '../../js/games/tetris.js';
import { decide, fmtProb, mode, probeHealth } from '../../js/api.js';
import { loadJSON, replayFrame } from '../../js/games/loop.js';

const params = new URLSearchParams(location.search);
const SEED = Number(params.get('seed') ?? 8);
const SPEED = Number(params.get('speed') ?? 1);
const W = 10, H = 20;
const NAMES = ['', 'single', 'double', 'triple', 'tetris'];
// Same palette as ./index.html.
const COLORS = { I: '#7fd0d6', O: '#d7c286', T: '#b3a0d2', S: '#8fd2a3', Z: '#d69aa0', J: '#93a9d4', L: '#d6ae8c' };
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms / SPEED));

const engine = new Tetris({ w: W, h: H, seed: SEED });
let cachedFrames = [], cached = false;
const cells = Array.from({ length: W * H }, () => document.createElement('i'));
$('board').append(...cells);
$('question').textContent = QUESTION;

// Paints the locked board, then where the piece would land if dropped right now, then the piece.
function draw(board, piece, clearRows = []) {
  const layer = board.map((row) => row.map((t) => t && ['lock', t]));
  const land = piece && dropRow(board, piece.cells, piece.col, W, H);
  if (land != null) for (const [dx, dy] of piece.cells) layer[land + dy][piece.col + dx] ||= ['ghost', piece.type];
  if (piece) for (const [dx, dy] of piece.cells) layer[piece.row + dy][piece.col + dx] = ['fall', piece.type];
  layer.forEach((row, y) => row.forEach((v, x) => {
    const e = cells[y * W + x];
    e.className = 'cell' + (v ? ' ' + v[0] : '') + (clearRows.includes(y) ? ' clear' : '');
    if (v) e.style.setProperty('--c', COLORS[v[1]]);
  }));
}

function drawSide(s) {
  $('lines').textContent = s.lines;
  $('score').textContent = s.score.toLocaleString('en-US');
  $('pieces').textContent = s.pieces;
  const next = SHAPES[s.next][0];
  $('next').replaceChildren(...next.cells.map(([x, y]) => {
    const e = document.createElement('i');
    e.style.cssText = `grid-area:${y + 1}/${x + 1};--c:${COLORS[s.next]}`;
    return e;
  }));
}

// One row per offered drop, in the engine's order; the bars fill once the answer arrives.
function drawOptions(options, pick, probs = {}) {
  $('options').classList.toggle('wait', !pick);
  $('options').replaceChildren(...options.map((o) => {
    const li = document.createElement('li'), p = probs[o.label];
    li.className = o === pick ? 'pick' : '';
    li.innerHTML = '<span class="lab"></span><b class="p"></b><i class="bar"></i>';
    li.querySelector('.lab').textContent = o.label;
    li.querySelector('.p').textContent = p == null ? '—' : fmtProb(p);
    // set after insertion so the width transitions from 0
    if (p != null) requestAnimationFrame(() => requestAnimationFrame(() => li.querySelector('.bar').style.setProperty('--p', p)));
    return li;
  }));
}

function replay(el, cls) {
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
}

function veil(title, text) {
  $('veilTitle').textContent = title;
  $('veilText').innerHTML = text;
  $('veil').hidden = false;
}

function cachedDecision(s, options) {
  const frame = replayFrame(cachedFrames, s.pieces);
  if (!frame || frame.tick !== s.pieces || JSON.stringify(frame.state?.board) !== JSON.stringify(s.board)) return null;
  const pick = options.find((o) => o.label === frame.move);
  return pick ? { pick, probs: frame.probs, p_null: frame.p_null, ms: frame.ms } : null;
}

function useCache() {
  cached = true;
  $('source').textContent = 'Cached · typical-small';
}

async function play() {
  $('veil').hidden = true;
  while (!engine.dead) {
    const s = engine.state(), options = engine.candidateDetails();
    const piece = { type: s.current.type, cells: s.current.cells, col: s.current.col, row: 0 };
    drawSide(s);
    draw(s.board, piece);
    drawOptions(options, null);
    $('meta').innerHTML = 'thinking…';

    let pick = options[0], probs = { [pick.label]: 1 };
    if (options.length > 1) {
      let r, res;
      if (cached) pick = null;
      if (!cached) {
        res = await decide(engine.describe(), [{ type: 'choice', question: QUESTION, labels: options.map((o) => o.label) }]);
        r = res?.results?.[0];
        pick = options.find((o) => o.label === r?.argmax);
      }
      const saved = cached || !pick ? cachedDecision(s, options) : null;
      if (saved) {
        useCache();
        ({ pick, probs } = saved);
        $('meta').innerHTML = `none of these <b>${fmtProb(saved.p_null)}</b> · cached · <b>${Math.round(saved.ms)} ms</b> recorded`;
      }
      // ponytail: no policy fallback on this page -- a silent substitute would put a move on video
      // that the model did not make. The only fallback is the same model's recorded decision.
      if (!pick) return veil('Model went quiet', 'the server stopped answering; press <code>R</code> to restart');
      if (!saved) {
        probs = r.probs;
        $('meta').innerHTML = `none of these <b>${fmtProb(r.p_null)}</b> · <b>${Math.round(res.ms)} ms</b> on ${res.device ?? 'device'}`;
      }
    } else {
      const saved = cachedDecision(s, options);
      if (cached && saved) probs = saved.probs;
      $('meta').innerHTML = cached ? 'cached model run · only one legal drop' : 'only one legal drop';
    }
    drawOptions(options, pick, probs);
    draw(s.board, piece);
    await sleep(320);

    // Act the choice out: rotate at the spawn row, slide to the column, drop.
    for (let r = 1; r <= pick.rotation; r++) {
      const st = SHAPES[piece.type][r];
      piece.cells = st.cells;
      piece.col = Math.min(piece.col, W - st.w);
      draw(s.board, piece);
      await sleep(80);
    }
    while (piece.col !== pick.col) {
      piece.col += Math.sign(pick.col - piece.col);
      draw(s.board, piece);
      await sleep(55);
    }
    while (piece.row < pick.row) {
      piece.row++;
      draw(s.board, piece);
      await sleep(12);
    }
    replay($('board'), 'thud');

    const landed = s.board.map((row) => row.slice());
    for (const [dx, dy] of pick.cells) landed[pick.row + dy][pick.col + dx] = piece.type;
    const full = landed.flatMap((row, y) => (row.every(Boolean) ? [y] : []));
    if (full.length) {
      draw(s.board, piece, full);
      $('callout').textContent = NAMES[full.length];
      replay($('callout'), 'go');
      await sleep(360);
    } else {
      await sleep(120);
    }
    engine.step(pick.label);
  }
  const s = engine.state();
  drawSide(s);
  draw(s.board, s.current && { ...s.current, row: 0 });
  veil(`${s.lines} lines`, `stacked out after ${s.pieces} pieces<br>every one placed by typical-small<br><br>press <code>R</code> to play again`);
}

addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') location.reload();
  if (e.key === ' ' && started) { e.preventDefault(); started(); started = null; }
});
let started = null;

drawSide(engine.state());
draw(engine.state().board, { ...engine.state().current, row: 0 });
const saved = await loadJSON('../../data/replays/tetris-solo.json');
if (saved?.summary?.seed === SEED && saved.summary.w === W && saved.summary.h === H) cachedFrames = saved.frames ?? [];
if ((await probeHealth()) === 'live') {
  // Waits for a key so the recording can start on a still board.
  veil('Ready', 'press <code>space</code> to start');
  started = play;
} else if (cachedFrames.length) {
  useCache();
  veil('Ready', 'cached typical-small run · press <code>space</code> to start');
  started = play;
} else {
  veil('Model offline', 'start the server from the repo root:<br><code>uv run uvicorn --app-dir site server:app --port 8787</code><br>then open this page from it');
}
</script>
</body>
</html>
